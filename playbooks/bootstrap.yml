---
# facts + debloat + harden, one account at a time (serial 1) so that a failure stops the run on the first account.
#   ansible-playbook corbet.cpmd.bootstrap -e target=playground            (a test account first)
#   ansible-playbook corbet.cpmd.bootstrap -e target=node01 [--check --diff]
- name: Bootstrap accounts
  hosts: "{{ target | mandatory }}"
  gather_facts: false
  serial: 1
  roles:
    - role: corbet.cpmd.facts
    - role: corbet.cpmd.debloat
    - role: corbet.cpmd.harden
