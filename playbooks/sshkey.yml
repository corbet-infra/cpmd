---
# Rewrite the admin key line of authorized_keys only (from=, options), one account at a time, and prove a FRESH key login
# afterwards. Nothing else of the harden role runs.
#   ansible-playbook corbet.cpmd.sshkey -e target=playground
#   CPMD_AUTH=key ansible-playbook corbet.cpmd.sshkey -e target=cluster
# Removing or widening the restriction cannot lock a key login out. Tightening it (a from= list that does not contain
# the controller's address) can: the play then fails at the fresh login and the password login of the shop (inventory
# default auth) is the way back in.
- name: Admin key line
  hosts: "{{ target | mandatory }}"
  gather_facts: false
  serial: 1
  tasks:
    - name: authorized_keys
      ansible.builtin.include_role:
        name: corbet.cpmd.harden
        tasks_from: authkey.yml

    - name: Drop the persistent connection (the next task logs in again)
      ansible.builtin.meta: reset_connection

    - name: Fresh login with the key works
      ansible.builtin.ping:
