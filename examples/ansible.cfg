[defaults]
inventory = inventory/accounts.sops_accounts.yml
gathering = explicit
inject_facts_as_vars = False
retry_files_enabled = False
forks = 5
enable_plugins = host_list, yaml, ini, corbet.crfs.sops_accounts

[inventory]
enable_plugins = host_list, yaml, ini, corbet.crfs.sops_accounts

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
