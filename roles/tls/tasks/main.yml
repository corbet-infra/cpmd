---
# Leaf certificate per box, signed by your CA. The key is made ON the box and never leaves it; the CA key
# comes from sops straight into openssl's stdin on the controller (no file). Names and addresses of the box
# are in the SAN; the same leaf serves every TLS service of the box (client and server auth).
- name: Required settings
  ansible.builtin.assert:
    that:
      - tls_names | length > 0
      - tls_ca_cert_file | length > 0
      - tls_ca_key_sops_file | length > 0
    fail_msg: "tls_names, tls_ca_cert_file and tls_ca_key_sops_file must be set, see the role defaults"
    quiet: true

- name: Directory of the leaf (private)
  ansible.builtin.file:
    path: "{{ tls_dir }}"
    state: directory

- name: SAN of this box
  ansible.builtin.set_fact:
    tls_san: "{{ (tls_names | map('regex_replace', '^(.*)$', 'DNS:\\1') | list + tls_ips | map('regex_replace', '^(.*)$', 'IP:\\1') | list) | join(',') }}"

- name: Fingerprint of your CA certificate
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ tls_ca_cert_file }}", -noout, -fingerprint, -sha256]
  delegate_to: localhost
  become: false
  register: tls_ca_fp_raw
  changed_when: false
  check_mode: false

- name: State of the leaf on the box
  ansible.builtin.script:
    cmd: "tls-state.sh '{{ tls_san }}' '{{ tls_ca_fp_raw.stdout.split('=')[1] }}' '{{ tls_dir }}'"
  register: tls_state
  changed_when: false
  check_mode: false

- name: Issue a leaf
  when: tls_state.stdout | trim != 'OK' and not ansible_check_mode
  block:
    - name: Key on the box (kept when it is still the right one)
      ansible.builtin.shell: |
        umask 077
        openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "{{ tls_dir }}/key.pem"
      when: tls_state.stdout | trim in ['NOKEY', 'KEYMISMATCH']

    - name: CSR
      ansible.builtin.command:
        argv: [openssl, req, -new, -key, "{{ tls_dir }}/key.pem", -subj, "/CN={{ tls_names[0] }}", -addext, "subjectAltName={{ tls_san }}"]
      register: tls_csr
      changed_when: false

    - name: Private scratch on the controller (/dev/shm)
      ansible.builtin.tempfile:
        state: directory
        path: /dev/shm
        prefix: cpmd-tls.
      delegate_to: localhost
      become: false
      register: tls_scratch

    - name: CSR and extensions as files there
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ tls_scratch.path }}/{{ item.name }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      loop_control:
        label: "{{ item.name }}"
      loop:
        - {name: leaf.csr, content: "{{ tls_csr.stdout }}\n"}
        - name: ext.cnf
          content: |
            subjectAltName={{ tls_san }}
            keyUsage=critical,digitalSignature
            extendedKeyUsage=serverAuth,clientAuth
            basicConstraints=critical,CA:false

    - name: Sign (CA key on stdin)
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -req
          - -in
          - "{{ tls_scratch.path }}/leaf.csr"
          - -CA
          - "{{ tls_ca_cert_file }}"
          - -CAkey
          - /dev/stdin
          - -set_serial
          - "0x{{ lookup('ansible.builtin.password', '/dev/null chars=hexdigits length=24') }}"
          - -days
          - "{{ tls_leaf_days }}"
          - -sha256
          - -extfile
          - "{{ tls_scratch.path }}/ext.cnf"
          - -out
          - "{{ tls_scratch.path }}/leaf.pem"
        stdin: "{{ lookup('corbet.cpmd.sops', tls_ca_key_sops_file, tls_ca_key_sops_key, multiline=true) }}\n"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Signed leaf
      ansible.builtin.slurp:
        src: "{{ tls_scratch.path }}/leaf.pem"
      delegate_to: localhost
      become: false
      register: tls_leaf

    - name: Leaf and CA onto the box
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ tls_dir }}/{{ item.name }}"
        mode: "0640"
      loop_control:
        label: "{{ item.name }}"
      loop:
        - {name: cert.pem, content: "{{ tls_leaf.content | b64decode }}"}
        - {name: ca.pem, content: "{{ lookup('ansible.builtin.file', tls_ca_cert_file) }}"}

    - name: Scratch gone
      ansible.builtin.command:
        argv: [shred, -u, "{{ tls_scratch.path }}/leaf.csr", "{{ tls_scratch.path }}/ext.cnf", "{{ tls_scratch.path }}/leaf.pem"]
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Scratch directory gone
      ansible.builtin.file:
        path: "{{ tls_scratch.path }}"
        state: absent
      delegate_to: localhost
      become: false

    - name: Remember that TLS material changed
      ansible.builtin.set_fact:
        tls_changed: true

- name: A leaf would be issued (check run)
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: leaf state {{ tls_state.stdout | trim }}, would be (re)issued"
  when: tls_state.stdout | trim != 'OK' and ansible_check_mode


# The private key is the one file here whose mode is declared (the directory mode is not: the shop re-chmods account homes, see the seaweedfs_volume role).
- name: Private key of the leaf
  ansible.builtin.stat:
    path: "{{ tls_dir }}/key.pem"
  register: tls_key_stat

- name: Private key is 0600
  ansible.builtin.file:
    path: "{{ tls_dir }}/key.pem"
    mode: "0600"
  when: tls_key_stat.stat.exists
